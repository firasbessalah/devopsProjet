version: "3.8"
services:
  mysqldb:
    image: mysql:5.7
    container_name: timesheet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 'rootpassword'  # Ajout d'un mot de passe root
      MYSQL_DATABASE: timesheet_db
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  app-timesheet:
    image: sfaxioussama/kaddem-app:1.0.0
    container_name: timesheet-app
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/timesheet_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 'rootpassword'  # Ajout du mot de passe correspondant
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  db:
networks:
  timesheet-net:
    driver: bridge