version: '3'
services:
  mysql-db:
    image: mysql:latest
    container_name: devops-db
    ports:
      - "3333:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: devops_project_db
    volumes:
      - ./data.sql:/docker-entrypoint-initdb.d/data.sql
    networks:
      - my-network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  back-app:
    image: hsinemt/devopsproject:backapp
    container_name: spring-back-project
    ports:
      - "8089:8089"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - my-network
    volumes:
      - ./backend-data:/app/data
    restart: always

networks:
  my-network:
