services:
  mysql:
    image: mysql:8.0
    container_name: mysql-db-${BUILD_NUMBER}  # Unique par build
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3306:3306"
    volumes:
      - mysql_data_${BUILD_NUMBER}:/var/lib/mysql

  app:
    image: eyaabaab/eyaabaab-g1-kaddem:latest
    container_name: kaddem-app-${BUILD_NUMBER}  # Unique par build
    depends_on:
      - mysql
    ports:
      - "8089:8089"

volumes:
  mysql_data_${BUILD_NUMBER}:
