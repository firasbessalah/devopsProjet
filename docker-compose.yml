version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    container_name: timesheet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""  # À remplacer par votre mot de passe
      MYSQL_DATABASE: timesheet_db
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3

  app-timesheet:
    image: sfaxioussama/kaddem-app:1.0.0
    container_name: timesheet-app
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url": "jdbc:mysql://mysqldb:3306/timesheet_db?createDatabaseIfNotExist=true",
        "spring.datasource.username": "root",
        "spring.datasource.password": "rootpassword",
        "spring.jpa.properties.hibernate.dialect": "org.hibernate.dialect.MySQL5InnoDBDialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  db:

networks:
  timesheet-net:
    driver: bridge