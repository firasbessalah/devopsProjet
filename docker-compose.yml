version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    container_name: timesheet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""  # À remplacer par un mot de passe sécurisé
      MYSQL_DATABASE: timesheet_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - timesheet-net

  app-timesheet:
    image: mouradhassini/timesheet-devops:1.0.0
    container_name: timesheet-app
    depends_on:
      - mysqldb
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/timesheet_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""  # Doit correspondre au mot de passe MySQL
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - timesheet-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mysql_data:

networks:
  timesheet-net:
    driver: bridge