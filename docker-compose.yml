version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    container_name: kaddem-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
      MYSQL_DATABASE: kaddem
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
    networks:
      - kaddem-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: sfaxioussama/kaddem-app:1.0.0
    container_name: kaddem-app
    depends_on:
      mysqldb:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/kaddem?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8082
      SERVER_SERVLET_CONTEXT_PATH: /kaddem
    networks:
      - kaddem-net

volumes:
  db:

networks:
  kaddem-net:
    driver: bridge